<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" role="img" aria-label="BM Digital Solutions logo">
  <defs>
    <linearGradient id="bmBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="bmOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Digital BM mark -->
  <g filter="url(#shadow)">
    <rect x="10" y="18" width="124" height="124" rx="30" fill="#0F172A"/>
    <rect x="18" y="26" width="108" height="108" rx="25" fill="url(#bmBlue)"/>
  </g>

  <!-- BM monogram -->
  <path d="M38 48h16v54h18c10 0 15-4 15-11 0-7-5-11-15-11H55V66h18c8 0 12-3 12-9 0-6-4-9-12-9H38z" fill="#fff"/>
  <path d="M76 48h18l10 23 10-23h18v54h-16V76l-12 24-12-24v26H76z" fill="#fff"/>

  <!-- Digital circuit accents -->
  <path d="M31 40h-9v-9h9M111 120h9v9h-9" fill="none" stroke="#FBBF24" stroke-width="4" stroke-linecap="round"/>
  <circle cx="35" cy="119" r="5" fill="url(#bmOrange)"/>
  <circle cx="115" cy="41" r="5" fill="url(#bmOrange)"/>

  <!-- Growth arrow -->
  <path d="M42 120l23-18 16 8 28-31" fill="none" stroke="url(#bmOrange)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M101 77h14v14" fill="none" stroke="#F97316" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="158" y="72" font-family="Poppins, Montserrat, Arial, sans-serif" font-size="34" font-weight="800" fill="#0F172A">BM</text>
  <text x="224" y="72" font-family="Poppins, Montserrat, Arial, sans-serif" font-size="34" font-weight="600" fill="#2563EB">Digital</text>
  <text x="158" y="108" font-family="Poppins, Montserrat, Arial, sans-serif" font-size="31" font-weight="700" fill="#F97316">SOLUTIONS</text>
  <text x="160" y="132" font-family="Poppins, Montserrat, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#64748B">SMART • SIMPLE • DIGITAL</text>
</svg>
