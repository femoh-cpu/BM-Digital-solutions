name: Restore website styles

on:
  push:
    paths:
      - '.github/workflows/restore-styles.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore styles.css from previous good version
        run: |
          git checkout 0494a721e52a0813691957512fcac8a851c85e80 -- styles.css
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          git commit -m "Restore original website styling" || exit 0
          git push
