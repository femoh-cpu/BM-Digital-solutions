name: Apply content improvements
on:
  push:
    paths:
      - '.github/workflows/apply-content-improvements.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update content only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          r={
          'Affordable Professional Websites That Help Businesses Grow':'Build a Professional Online Presence Without the Agency Price Tag',
          'We create beautiful, fast, and affordable websites for small businesses, startups, and organizations. Let us help your business build a strong online presence.':'We create professional, fast, and affordable websites for small businesses, startups, and organizations. Give your customers a clear place to discover your services, trust your brand, and get in touch.',
          '>Get Started</a>':'>Start Your Project</a>',
          '>Request Free Quote</a>':'>See Our Services</a>',
          '5+</strong>\n              <span>Years of digital support experience':'Affordable</strong>\n              <span>Professional solutions for growing businesses',
          '24/7</strong>\n              <span>Friendly support and updates':'Clear</strong>\n              <span>Communication from start to delivery',
          '100%</strong>\n              <span>Responsive and mobile-friendly delivery':'Mobile</strong>\n              <span>Friendly websites built for today&#39;s customers',
          'Premium concepts that show the kind of polished website experience we can build for your brand.':'Explore our demo projects and see how we turn different business ideas into polished online experiences.',
          'Perfect for a lodge, travel agency, or hospitality brand that wants to look premium, inspiring, and easy to book.':'A demo concept for a lodge, travel agency, or hospitality brand. It shows how a strong website can present services, build trust, and guide visitors toward enquiries.',
          'Ideal for contractors, developers, and builders who want a site that communicates quality, reliability, and project trust.':'A demo concept for contractors, developers, and builders. It shows how services, projects, and contact options can be presented clearly to potential clients.',
          'Businesses trust us to build a cleaner, smarter digital presence.':'What you can expect when you work with BM Digital Solutions',
          '“The process was smooth, clear, and professional from start to finish. Our website finally feels like the real business we are.”':'A clear process, practical guidance, and a website built around your business goals.',
          '“BM Digital Solutions understood our needs and delivered a website that looks credible, modern, and easy for customers to use.”':'A professional online presence that makes it easier for customers to understand your services and contact you.',
          '“We wanted something simple but professional. They gave us a polished site that actually helps people trust our brand.”':'Affordable solutions without unnecessary complexity, with room to grow as your business grows.',
          'href="https://wa.me/254711608106" target="_blank" rel="noreferrer" aria-label="Chat on WhatsApp"':'href="https://wa.me/254711608106?text=Hi%20BM%20Digital%20Solutions%2C%20I%27d%20like%20to%20get%20a%20quote%20for%20a%20website." target="_blank" rel="noreferrer" aria-label="Chat on WhatsApp"'}
          for a,b in r.items(): s=s.replace(a,b)
          p.write_text(s)
          p=Path('portfolio.html'); s=p.read_text()
          r={
          'We help businesses from many industries present themselves online with confidence.':'See What We Can Build for Your Business',
          'We create polished online experiences for businesses with different goals and audiences':'Explore our demo projects and see how a professional website can present your business clearly and confidently',
          'These are examples of the kinds of projects we can shape into a clear, professional website that fits your brand.':'These demo projects are examples of our capabilities. If you like an idea, we can adapt the structure, content, and features to fit your own business and budget.',
          'A luxury safari and travel concept created to show how a hospitality brand can build trust, highlight offers, and inspire bookings.':'A demo concept showing how a hospitality brand can build trust, showcase experiences, and guide visitors toward enquiries or bookings.',
          'We focus on showing your business in the best light, helping visitors understand your offer quickly, and giving your brand a professional presence that grows with you.':'Our demos show how we combine clear messaging, simple navigation, strong calls to action, and mobile-friendly presentation to help visitors understand your business quickly.'}
          for a,b in r.items(): s=s.replace(a,b)
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          rm -f .github/workflows/apply-content-improvements.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html portfolio.html .github/workflows/apply-content-improvements.yml
          git commit -m 'Improve client-facing website content' || exit 0
          git push
